# Site for the VM's reverse-proxy container (/opt/nginx/conf.d/melodify.conf).
# The name is resolved at request time through Docker's DNS, so redeploys (new container IP)
# never cause 502s and the proxy still starts when Melodify is down.

server {
    listen 443 ssl;
    server_name melodify.anasserekysy.com;

    ssl_certificate /etc/letsencrypt/live/anasserekysy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anasserekysy.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $melodify http://melodify:5001;

    location / {
        proxy_pass $melodify;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
